<style>
/* Plan : lecteur mobile, nuit bleu encre, jaune soleil pour l'action, pochettes en sillons de vinyle */
:root{
  --bg:#0E1220; --surface:#161B2E; --surface2:#1F2540; --line:#2A3152;
  --text:#F2EEE6; --muted:#9AA0BC; --accent:#FFC53D; --accent-ink:#1A1400; --red:#F0584A;
  --fd:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --fb:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}
#app{position:relative;display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.hdr h1{font-family:var(--fd);font-weight:800;font-size:28px;letter-spacing:-.02em}
.hdr h1 span{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.ghost{background:var(--surface2);color:var(--text)}
.chip svg.i{width:18px;height:18px}
main{flex:1;overflow-y:auto;padding:4px 16px 16px;scrollbar-width:thin}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:12px 0}
.search input::placeholder{color:var(--muted)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar .grow{flex:1}
h2.sec{font-family:var(--fd);font-size:20px;margin:6px 0 10px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:12px;cursor:pointer}
.row:active{background:var(--surface)}
.row.on .t{color:var(--accent)}
.row .tx{flex:1;min-width:0}
.t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.ico:active{background:var(--surface2)}
.ico.liked{color:var(--red)}
.cover{position:relative;flex:none;width:48px;height:48px;border-radius:8px;overflow:hidden;display:grid;place-items:center}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover b{font-family:var(--fd);font-size:1.1em;color:rgba(255,255,255,.85);position:relative}
.cover.lg{width:100%;height:auto;aspect-ratio:1;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.cover.lg b{font-size:72px}
.cover.sm{width:44px;height:44px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-right:6px;vertical-align:-1px}
.eq i{display:block;width:3px;background:var(--accent);border-radius:1px;animation:eq 0.9s ease-in-out infinite;height:30%}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.eq.paused i{animation-play-state:paused}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h3{font-family:var(--fd);color:var(--text);font-size:20px;margin-bottom:6px}
.empty .chip{margin-top:16px}
.pl{display:flex;align-items:center;gap:12px;padding:8px 4px;cursor:pointer;border-radius:12px}
.pl .cover{background:var(--surface2)}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;font-weight:500}
.mini{display:flex;align-items:center;gap:10px;margin:0 8px;padding:8px 8px 10px;background:var(--surface2);border-radius:14px;position:relative;cursor:pointer}
.mini[hidden]{display:none}
.mini .tx{flex:1;min-width:0}
.mini .prog{position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.mini .prog i{display:block;height:100%;width:0;background:var(--accent)}
.nav{display:flex;padding:6px 8px 10px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;color:var(--muted);font-size:12px;font-weight:500}
.nav button.on{color:var(--accent)}
.play{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.player{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;padding:12px 24px 24px;background:var(--bg);transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.player.open{transform:none;visibility:visible}
.player .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.player .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;container-type:size}
.player .art .cover{width:min(100cqw,100cqh);height:auto;aspect-ratio:1}
.player h2{font-family:var(--fd);font-size:24px;line-height:1.15;margin-top:16px;overflow-wrap:anywhere}
.seek{width:100%;margin:14px 0 2px;accent-color:var(--accent)}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ctl .big{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ctl .big svg.i{width:34px;height:34px}
.ctl .on{color:var(--accent)}
.ctl .badge{position:relative}
.ctl .badge em{position:absolute;right:4px;bottom:4px;font-size:9px;font-style:normal;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 3px}
.extra{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted)}
.extra button{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-size:13px}
.extra button.on{color:var(--accent)}
.back{position:absolute;inset:0;z-index:30;background:rgba(5,7,14,.6);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:78%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px 24px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--fd);font-size:18px;margin-bottom:10px}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:13px 6px;text-align:left;border-radius:10px}
.act:active{background:var(--surface2)}
.act.danger{color:var(--red)}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:12px;margin-bottom:12px}
.btns{display:flex;gap:8px;justify-content:flex-end}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}

.logo{display:flex;align-items:center;gap:10px}
.logo img{width:36px;height:36px;flex:none;display:block}
.hdr .right{display:flex;align-items:center;gap:4px}
.micbtn.listening{color:var(--accent);background:rgba(255,197,61,.16);animation:pulse 1.6s ease-in-out infinite}
.micbtn.blocked{color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,197,61,.18)}}
.player .top .grp{display:flex;gap:0}
.mini.idle .lg{width:44px;height:44px;flex:none}
.eqrow{display:grid;grid-template-columns:64px 1fr 52px;align-items:center;gap:8px;margin:8px 0}
.eqrow label{font-size:13px;color:var(--muted)}
.eqrow output{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;font-size:13px}
.eqrow.boost label{color:var(--accent);font-weight:700}
.sl{width:100%;accent-color:var(--accent)}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.presets .chip{padding:7px 12px;font-size:13px}
.presets .chip.on{background:var(--accent);color:var(--accent-ink)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0}
.hint.warn{color:var(--red)}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:60%}.player,.sheet{transition:none;animation:none}}
</style>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!isFinite(s)||s<0)return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const icon=n=>'<svg class="i"><use href="#i-'+n+'"/></svg>';

/* ---------- Etat léger (favoris, playlists) ---------- */
let S={fav:[],lists:[],hidden:[]};
try{const r=localStorage.getItem('nzembo.v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('nzembo.v1',JSON.stringify(S))}catch(e){}};

/* ---------- IndexedDB : fichiers audio et pochettes ---------- */
let db=null;
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('nzembo',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('blobs')};
  r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>res(null);r.onblocked=()=>res(null);
}catch(e){res(null)}})}
function idb(store,mode,fn){return new Promise(res=>{
  if(!db)return res(null);
  try{const tx=db.transaction(store,mode);const rq=fn(tx.objectStore(store));
    tx.oncomplete=()=>res(rq&&rq.result!==undefined?rq.result:true);tx.onerror=()=>res(null);tx.onabort=()=>res(null);
  }catch(e){res(null)}});}

/* ---------- Lecture des étiquettes ID3 (titre, artiste, album, pochette) ---------- */
function decText(b){
  if(!b.length)return'';
  const enc=b[0];let r=b.subarray(1),label='iso-8859-1';
  if(enc===3)label='utf-8';
  else if(enc===1||enc===2){
    label=enc===2?'utf-16be':'utf-16le';
    if(r[0]===0xFF&&r[1]===0xFE){label='utf-16le';r=r.subarray(2)}
    else if(r[0]===0xFE&&r[1]===0xFF){label='utf-16be';r=r.subarray(2)}
  }
  let s='';try{s=new TextDecoder(label).decode(r)}catch(e){}
  const z=s.indexOf('\u0000');return(z>=0?s.slice(0,z):s).trim();
}
function parseApic(b){
  const enc=b[0];let i=1;while(i<b.length&&b[i]!==0)i++;
  let mime=String.fromCharCode.apply(null,b.subarray(1,i));i+=2;
  if(enc===1||enc===2){while(i+1<b.length&&!(b[i]===0&&b[i+1]===0))i+=2;i+=2}
  else{while(i<b.length&&b[i]!==0)i++;i++}
  if(i>=b.length)return null;
  if(!/^image\//.test(mime))mime='image/jpeg';
  return new Blob([b.slice(i)],{type:mime});
}
async function readTags(file){
  const out={};
  try{
    const buf=await file.slice(0,Math.min(file.size,2500000)).arrayBuffer();
    const u8=new Uint8Array(buf),v=new DataView(buf);

  const fr=(deg,oct)=>{const k=((deg%L)+L)%L,o=Math.floor(deg/L);return sp.root*Math.pow(2,(sp.scale[k]+12*(oct+o))/12)};

    const t=k*step,b=k%8,root=sp.prog[Math.floor(k/8)%sp.prog.length];
    if(b===0||b===4)add(t,.25,x=>Math.sin(TP*(45*x+75*(1-Math.exp(-30*x))/30))*Math.exp(-x*13)*.9);
    add(t,.05,x=>(rnd()*2-1)*Math.exp(-x*70)*(b%2?.14:.07));
    if(b===0||b===3||b===6){const f=fr(root,-2);add(t,.38,x=>(2/Math.PI)*Math.asin(Math.sin(TP*f*x))*Math.exp(-x*5)*.4)}

    if(rnd()<.55){lead=Math.max(0,Math.min(2*L,lead+Math.round((rnd()-.5)*4)));const fl=fr(lead,0);
      add(t,.5,x=>(Math.sin(TP*fl*x)+.3*Math.sin(TP*2*fl*x))*Math.min(1,x*90)*Math.exp(-x*6)*.2)}

let lib=[];const mem=new Map();
const byId=id=>lib.find(t=>t.id===id);
async function getBlob(id){
  if(mem.has(id))return mem.get(id);
  const d=DEMOS.find(x=>x.id===id);
  if(d){const b=synth(d);mem.set(id,b);return b}
  const b=await idb('blobs','readonly',s=>s.get(id));
  return b&&b!==true?b:null;
}
async function loadLib(){
  await openDB();
  const metas=(await idb('meta','readonly',s=>s.getAll()))||[];
  lib=(Array.isArray(metas)?metas:[]).map(m=>{if(m.cover)m.coverUrl=URL.createObjectURL(m.cover);return m});
  lib.sort((a,b)=>b.added-a.added);
  DEMOS.forEach(d=>{if(!S.hidden.includes(d.id))lib.push({id:d.id,title:d.title,artist:d.artist,album:'Exemples',dur:d.dur,demo:true,added:0})});
}
async function addFiles(files){
  let ok=0,volatile=0;
  for(const f of files){
    if(!(f.type.indexOf('audio/')===0||/\.(mp3|m4a|aac|wav|ogg|opus|flac|wma)$/i.test(f.name)))continue;
    const tags=await readTags(f),dur=await probeDur(f);
    let title=tags.title,artist=tags.artist;
    const base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
    if(!title){const m=base.match(/^(.+?)\s+-\s+(.+)$/);if(m&&!artist){artist=m[1];title=m[2]}else title=base}
    const t={id:uid(),title:title,artist:artist||'Artiste inconnu',album:tags.album||'',dur:dur,cover:tags.cover||null,added:Date.now()};
    const saved=(await idb('blobs','readwrite',s=>s.put(f,t.id)))&&(await idb('meta','readwrite',s=>s.put(t)));
    if(!saved){mem.set(t.id,f);volatile++}
    if(t.cover)t.coverUrl=URL.createObjectURL(t.cover);
    lib.unshift(t);ok++;
  }
  return{ok:ok,volatile:volatile};
}
async function removeTrack(id){
  const t=byId(id);if(!t)return;
  if(t.demo){if(!S.hidden.includes(id))S.hidden.push(id)}
  else{await idb('meta','readwrite',s=>s.delete(id));await idb('blobs','readwrite',s=>s.delete(id));mem.delete(id);if(t.coverUrl)URL.revokeObjectURL(t.coverUrl)}
  lib=lib.filter(x=>x.id!==id);
  S.fav=S.fav.filter(x=>x!==id);S.lists.forEach(l=>{l.ids=l.ids.filter(x=>x!==id)});save();
}

}

/* ---------- Amplificateur et égaliseur (Web Audio) ---------- */
const EQ_BANDS=[[60,'lowshelf','60 Hz'],[230,'peaking','230 Hz'],[910,'peaking','910 Hz'],[3600,'peaking','3,6 kHz'],[14000,'highshelf','14 kHz']];
const PRESETS={'Normal':{boost:100,bands:[0,0,0,0,0]},'Basses+':{boost:120,bands:[7,4,0,-1,0]},'Voix':{boost:110,bands:[-3,-1,3,4,1]},'Aigus+':{boost:100,bands:[-2,0,1,4,7]},'Soirée':{boost:150,bands:[6,3,0,3,5]}};
const EQ=Object.assign({boost:100,bands:[0,0,0,0,0],preset:'Normal'},S.eq||{});
const G={ctx:null,pre:null,filters:[]};
const eqFlat=()=>EQ.boost<=100&&EQ.bands.every(v=>v===0);
function ensureGraph(){
  if(G.ctx)return true;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;
    const ctx=new C(),src=ctx.createMediaElementSource(a),pre=ctx.createGain();
    let node=pre;src.connect(pre);
    const fl=EQ_BANDS.map(b=>{const f=ctx.createBiquadFilter();f.type=b[1];f.frequency.value=b[0];if(b[1]==='peaking')f.Q.value=1;node.connect(f);node=f;return f});
    const comp=ctx.createDynamicsCompressor();
    comp.threshold.value=-8;comp.knee.value=12;comp.ratio.value=12;comp.attack.value=.003;comp.release.value=.25;
    node.connect(comp);comp.connect(ctx.destination);
    G.ctx=ctx;G.pre=pre;G.filters=fl;return true;
  }catch(e){return false}
}
function applyEQ(){
  if(!G.ctx)return;
  G.pre.gain.value=EQ.boost/100;
  G.filters.forEach((f,i)=>{f.gain.value=EQ.bands[i]});
  if(G.ctx.state==='suspended')G.ctx.resume().catch(()=>{});
}
function setEQ(part){
  Object.assign(EQ,part);S.eq={boost:EQ.boost,bands:EQ.bands.slice(),preset:EQ.preset};save();
  if(!eqFlat()&&!ensureGraph()){toast('Amplificateur non pris en charge ici');return}
  applyEQ();
}

}
function renderList(){
  const m=$('#main'),keep=m.scrollTop,box=$('#list');if(!box)return;
  if(V.view==='playlists'){
    box.innerHTML=S.lists.length?S.lists.map(l=>{
      const f=byId(l.ids[0]);
      return '<div class="pl" data-a="openpl" data-pl="'+l.id+'">'+(f?coverHTML(f):'<div class="cover">'+icon('note')+'</div>')
        +'<div class="tx" style="flex:1;min-width:0"><div class="t">'+esc(l.name)+'</div><div class="s">'+plural(l.ids.filter(id=>byId(id)).length,'titre')+'</div></div></div>';
    }).join(''):emptyBlock('Aucune playlist','Crée une playlist puis ajoute-y des titres depuis le menu ⋮ de chaque morceau.');
    return;
  }
  const r=viewTracks();V.shown=r.map(t=>t.id);
  const c=$('#count');if(c)c.textContent=plural(r.length,'titre');
  if(!r.length){
    box.innerHTML=V.view==='titres'?(V.q?emptyBlock('Aucun résultat','Essaie un autre mot.'):emptyBlock('Bibliothèque vide','Ajoute des fichiers audio de ton téléphone pour les écouter ici.',true))
      :V.view==='favoris'?emptyBlock('Pas encore de favori','Touche le cœur d’un titre pour le retrouver ici.')
      :emptyBlock('Playlist vide','Ajoute des titres depuis le menu ⋮ d’un morceau.');
    return;
  }
  box.innerHTML=r.map(trackRow).join('');
  m.scrollTop=keep;refreshRows();
}
function refreshRows(){
  const t=cur(),playing=!a.paused&&!a.ended;
  document.querySelectorAll('.row[data-id]').forEach(r=>{
    const on=!!t&&r.dataset.id===t.id;r.classList.toggle('on',on);
    const s=r.querySelector('.eqslot');if(s)s.innerHTML=on?'<span class="eq'+(playing?'':' paused')+'"><i></i><i></i><i></i></span>':'';
  });
}
function renderView(){
  const m=$('#main');let h='';
  const btns='<button class="chip" data-a="playall">'+icon('play')+'Lire</button><button class="chip ghost" data-a="shufall">'+icon('shuffle')+'Aléatoire</button>';
  if(V.view==='titres')h='<div class="search">'+icon('search')+'<input id="q" type="search" placeholder="Titre, artiste, album" value="'+esc(V.q)+'" aria-label="Rechercher"></div>'
    +'<div class="bar">'+btns+'<button class="chip ghost" data-a="sort">'+SORTS[V.sort]+'</button><span class="grow"></span><span class="muted" id="count"></span></div>';
  else if(V.view==='favoris')h='<h2 class="sec">Favoris</h2><div class="bar">'+btns+'<span class="grow"></span><span class="muted" id="count"></span></div>';
  else if(V.view==='playlists')h='<h2 class="sec">Playlists</h2><div class="bar"><button class="chip" data-a="newpl">'+icon('plus')+'Nouvelle playlist</button></div>';
  else{const l=plById(V.pl);
    h='<div class="bar"><button class="chip ghost" data-a="back">← Playlists</button><span class="grow"></span><button class="ico" data-a="plmenu" aria-label="Options de la playlist">'+icon('more')+'</button></div>'
      +'<h2 class="sec">'+esc(l?l.name:'')+'</h2><div class="bar">'+btns+'<span class="grow"></span><span class="muted" id="count"></span></div>';}
  m.innerHTML=h+'<div id="list"></div>';m.scrollTop=0;renderList();
}
function go(v,pl){
  V.view=v;V.pl=pl||null;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(v==='list'?'playlists':v)));
  renderView();
}

/* ---------- Feuilles (menus) ---------- */
const host=$('#host');
function openSheet(html){
  host.innerHTML='<div class="back" id="back"><div class="sheet" role="dialog">'+html+'</div></div>';
  $('#back').addEventListener('click',e=>{if(e.target.id==='back')closeSheet()});
}
function closeSheet(){host.innerHTML=''}
function act(a_,label,ico,cls){return '<button class="act'+(cls?' '+cls:'')+'" data-s="'+a_+'">'+icon(ico)+'<span>'+label+'</span></button>'}
function sheetOn(handlers){
  host.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{const f=handlers[b.dataset.s];if(f)f(b)}));
}
function trackMenu(id){
  const t=byId(id);if(!t)return;
  const inPl=V.view==='list'&&plById(V.pl)&&plById(V.pl).ids.includes(id);
  openSheet('<div class="row" style="cursor:default">'+coverHTML(t)+'<div class="tx"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(t.artist)+'</div></div></div>'
    +act('next','Lire ensuite','next1')+act('queue','Ajouter à la file','queue')+act('pl','Ajouter à une playlist','list')
    +act('fav',isFav(id)?'Retirer des favoris':'Ajouter aux favoris',isFav(id)?'heartf':'heart')
    +(inPl?act('unpl','Retirer de cette playlist','close'):'')
    +act('del',t.demo?'Masquer cet exemple':'Supprimer de la bibliothèque','trash','danger'));
  sheetOn({
    next:()=>{closeSheet();enqueue(id,true)},queue:()=>{closeSheet();enqueue(id,false)},
    pl:()=>pickPlaylist(id),fav:()=>{closeSheet();toggleFav(id)},
    unpl:()=>{const l=plById(V.pl);l.ids=l.ids.filter(x=>x!==id);save();closeSheet();renderList()},
    del:()=>confirmDel(id)
  });
}
function confirmDel(id){
  const t=byId(id);if(!t)return;
  openSheet('<h3>'+(t.demo?'Masquer':'Supprimer')+' « '+esc(t.title)+' » ?</h3><p class="muted" style="margin-bottom:14px">'+(t.demo?'Cet exemple ne sera plus affiché.':'Le fichier sera retiré de la bibliothèque de cet appareil.')+'</p>'
    +'<div class="btns"><button class="chip ghost" data-s="no">Annuler</button><button class="chip" style="background:var(--red);color:#fff" data-s="yes">Confirmer</button></div>');
  sheetOn({no:closeSheet,yes:async()=>{
    closeSheet();
    const wasCur=cur()&&cur().id===id;
    for(let i=P.queue.length-1;i>=0;i--)if(P.queue[i]===id&&i!==P.idx)removeFromQueue(i);
    await removeTrack(id);
    if(wasCur){const nq=P.queue.filter(x=>x!==id);const k=P.idx;P.queue=nq;P.orig=P.orig.filter(x=>x!==id);
      if(nq.length){P.idx=Math.min(k,nq.length-1);const was=!a.paused;P.idx=Math.min(k,nq.length-1);playIndex(P.idx);if(!was)setTimeout(()=>a.pause(),0)}
      else{a.pause();a.removeAttribute('src');a.load();P.idx=-1;P.queue=[];$('#player').classList.remove('open')}}
    updateUI();renderList();toast(t.demo?'Exemple masqué':'Titre supprimé');
  }});
}
function pickPlaylist(id){
  openSheet('<h3>Ajouter à une playlist</h3>'+act('new','Nouvelle playlist','plus')
    +S.lists.map(l=>'<button class="act" data-s="p" data-pl="'+l.id+'">'+icon('list')+'<span>'+esc(l.name)+'</span></button>').join(''));
  sheetOn({
    new:()=>nameDialog('Nouvelle playlist','',n=>{const l={id:uid(),name:n,ids:[id]};S.lists.push(l);save();toast('Ajouté à « '+n+' »');renderList()}),
    p:b=>{const l=plById(b.dataset.pl);if(!l.ids.includes(id))l.ids.push(id);save();closeSheet();toast('Ajouté à « '+l.name+' »');renderList()}
  });
}
function nameDialog(title,val,cb){
  openSheet('<h3>'+title+'</h3><input class="field" id="nm" maxlength="60" placeholder="Nom de la playlist" value="'+esc(val)+'" aria-label="Nom">'
    +'<div class="btns"><button class="chip ghost" data-s="no">Annuler</button><button class="chip" data-s="ok">Valider</button></div>');
  const f=$('#nm');f.focus();
  const ok=()=>{const n=f.value.trim();if(!n){f.focus();return}closeSheet();cb(n)};
  f.addEventListener('keydown',e=>{if(e.key==='Enter')ok()});
  sheetOn({no:closeSheet,ok:ok});
}
function queueSheet(){
  if(!P.queue.length){toast('La file est vide');return}
  openSheet('<h3>File d’attente</h3>'+P.queue.map((id,i)=>{const t=byId(id);if(!t)return'';
    return '<div class="row'+(i===P.idx?' on':'')+'" data-s="q" data-i="'+i+'">'+coverHTML(t,'sm')+'<div class="tx"><div class="t">'+esc(t.title)+'</div><div class="s">'+esc(t.artist)+'</div></div>'
      +(i===P.idx?'':'<button class="ico" data-s="rm" data-i="'+i+'" aria-label="Retirer de la file">'+icon('close')+'</button>')+'</div>'}).join(''));
  host.querySelectorAll('[data-s="q"]').forEach(r=>r.addEventListener('click',e=>{
    const rm=e.target.closest('[data-s="rm"]');
    if(rm){removeFromQueue(+rm.dataset.i);queueSheet();return}
    closeSheet();playIndex(+r.dataset.i);
  }));
}
function sleepSheet(){
  openSheet('<h3>Minuteur de sommeil</h3>'+[15,30,45,60].map(m=>'<button class="act" data-s="m" data-m="'+m+'">'+icon('moon')+'<span>Arrêter dans '+m+' min</span></button>').join('')
    +(P.sleepAt?act('off','Désactiver le minuteur','close'):''));
  sheetOn({m:b=>{closeSheet();setSleep(+b.dataset.m)},off:()=>{closeSheet();setSleep(0)}});
}
function plMenu(){
  const l=plById(V.pl);if(!l)return;
  openSheet('<h3>'+esc(l.name)+'</h3>'+act('ren','Renommer','list')+act('del','Supprimer la playlist','trash','danger'));
  sheetOn({
    ren:()=>nameDialog('Renommer la playlist',l.name,n=>{l.name=n;save();renderView()}),
    del:()=>{S.lists=S.lists.filter(x=>x!==l);save();closeSheet();go('playlists');toast('Playlist supprimée')}
  });
}


/* ---------- Égaliseur et amplificateur ---------- */
function eqSheet(){
  const chips=Object.keys(PRESETS).map(n=>'<button class="chip ghost'+(EQ.preset===n?' on':'')+'" data-s="pre" data-n="'+n+'">'+n+'</button>').join('');
  const rows=EQ_BANDS.map((b,i)=>'<div class="eqrow"><label for="eb'+i+'">'+b[2]+'</label><input class="sl" type="range" id="eb'+i+'" data-i="'+i+'" min="-12" max="12" step="1" value="'+EQ.bands[i]+'"><output id="eo'+i+'">'+fdb(EQ.bands[i])+'</output></div>').join('');
  openSheet('<h3>Amplificateur et égaliseur</h3>'
    +'<div class="eqrow boost"><label for="eboost">Volume</label><input class="sl" type="range" id="eboost" min="100" max="300" step="5" value="'+EQ.boost+'"><output id="eoboost">'+EQ.boost+' %</output></div>'
    +'<p class="hint" id="ewarn"></p><div class="presets">'+chips+'</div>'+rows
    +'<p class="hint">Au-dessus de 100 %, le son est amplifié puis limité pour éviter la saturation. Le réglage ne change pas le volume du téléphone.</p>'
    +'<div class="btns"><button class="chip ghost" data-s="reset">Réinitialiser</button><button class="chip" data-s="done">Terminer</button></div>');
  warn();
  const bo=$('#eboost');
  bo.addEventListener('input',()=>{setEQ({boost:+bo.value,preset:'Personnalisé'});$('#eoboost').textContent=bo.value+' %';warn();markPreset()});
  host.querySelectorAll('input[data-i]').forEach(s=>s.addEventListener('input',()=>{
    const bands=EQ.bands.slice();bands[+s.dataset.i]=+s.value;setEQ({bands:bands,preset:'Personnalisé'});$('#eo'+s.dataset.i).textContent=fdb(+s.value);markPreset()}));
  sheetOn({
    pre:b=>{const p=PRESETS[b.dataset.n];setEQ({boost:p.boost,bands:p.bands.slice(),preset:b.dataset.n});eqSheet()},
    reset:()=>{const p=PRESETS.Normal;setEQ({boost:p.boost,bands:p.bands.slice(),preset:'Normal'});eqSheet()},
    done:closeSheet
  });
}
function fdb(v){return(v>0?'+':'')+v+' dB'}
function warn(){const w=$('#ewarn');if(!w)return;w.className='hint'+(EQ.boost>200?' warn':'');w.textContent=EQ.boost>200?'Volume très fort : risque pour l\u2019oreille et les haut-parleurs.':(EQ.boost>100?'Amplification active.':'')}
function markPreset(){host.querySelectorAll('.presets .chip').forEach(c=>c.classList.toggle('on',c.dataset.n===EQ.preset))}

/* ---------- Commandes vocales : « Zoom Play music », « Zoom Next », « Zoom Prev », « Zoom Pause » ---------- */
const SRec=window.SpeechRecognition||window.webkitSpeechRecognition;
const Vc={on:false,rec:null,quick:0,t0:0};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function parseCmd(txt){
  const m=norm(txt).match(/\bzoo?u?m+e?(?:\s*play)?\s+(play\s*music|play|music|musique|next|prev|previous|precedent|pause|stop)\b/);
  if(!m)return null;
  const w=m[1];
  if(/^(play|music|musique)/.test(w))return'play';
  if(w==='next')return'next';
  if(/^prev|precedent/.test(w))return'prev';
  return'pause';
}
function runCmd(c){
  if(c==='play'){if(cur())a.play().catch(()=>{});else playList(lib.map(t=>t.id),0,'Bibliothèque')}
  else if(c==='next')next(false);
  else if(c==='prev')prev();
  else a.pause();
  toast('Commande vocale : '+{play:'lecture',next:'suivant',prev:'précédent',pause:'pause'}[c]);
}
function micUI(s){
  MIC=s;
  document.querySelectorAll('.micbtn').forEach(b=>{
    b.classList.toggle('listening',s==='on');b.classList.toggle('blocked',s==='blocked');
    b.setAttribute('aria-pressed',s==='on'?'true':'false');
    b.setAttribute('aria-label','Micro permanent : '+(s==='on'?'activé':'désactivé'));
  });
}
function voiceStop(){S.mic=false;save();Vc.on=false;if(Vc.rec){try{Vc.rec.onend=null;Vc.rec.stop()}catch(e){}Vc.rec=null}micUI('off')}
function voiceFail(msg,quiet){Vc.on=false;Vc.rec=null;micUI('blocked');if(!quiet)toast(msg)}
function voiceBegin(quiet){
  const r=new SRec();Vc.rec=r;r.lang='fr-FR';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  let done=new Set();
  r.onstart=()=>{done=new Set();Vc.t0=Date.now();micUI('on')};
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(done.has(i))continue;const c=parseCmd(e.results[i][0].transcript);if(c){done.add(i);runCmd(c)}}};
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed')voiceFail('Micro bloqué dans cette fenêtre. L\u2019écoute permanente demande l\u2019appli Android installée.',quiet);
    else if(e.error==='network')voiceFail('Service vocal injoignable (réseau).',quiet);
    else if(e.error==='audio-capture')voiceFail('Aucun micro détecté.',quiet);
  };
  r.onend=()=>{
    if(!Vc.on)return;
    Vc.quick=(Date.now()-Vc.t0<1500)?Vc.quick+1:0;
    if(Vc.quick>5){voiceFail('Le micro s\u2019arrête sans cesse : réessaie plus tard.');return}
    setTimeout(()=>{if(Vc.on){try{r.start()}catch(x){}}},300);
  };
  try{r.start()}catch(e){voiceFail('Impossible de démarrer le micro.')}
}
function voiceToggle(){
  if(Vc.on){voiceStop();toast('Commandes vocales désactivées');return}
  if(!SRec){toast('Ce navigateur ne gère pas les commandes vocales');return}
  S.mic=true;save();Vc.on=true;Vc.quick=0;micUI('on');voiceBegin(false);
  toast('Dis « Zoom Play music », « Zoom Next », « Zoom Prev » ou « Zoom Pause »');
}

/* ---------- Branchements ---------- */
$('#main').addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const k=el.dataset.a,row=el.closest('.row[data-id]');
  if(k==='more'&&row){e.stopPropagation();trackMenu(row.dataset.id)}
  else if(k==='play'&&row){const i=V.shown.indexOf(row.dataset.id);playList(V.shown,i,V.label)}
  else if(k==='playall'){playList(V.shown,0,V.label)}
  else if(k==='shufall'){if(!V.shown.length)return;if(!P.shuffle)P.shuffle=true;playList(V.shown,Math.floor(Math.random()*V.shown.length),V.label)}
  else if(k==='sort'){V.sort=V.sort==='recent'?'az':V.sort==='az'?'artist':'recent';renderView()}
  else if(k==='add'){$('#file').click()}
  else if(k==='newpl'){nameDialog('Nouvelle playlist','',n=>{S.lists.push({id:uid(),name:n,ids:[]});save();renderList()})}
  else if(k==='openpl'){go('list',el.dataset.pl)}
  else if(k==='back'){go('playlists')}
  else if(k==='plmenu'){plMenu()}
});
$('#main').addEventListener('input',e=>{if(e.target.id==='q'){V.q=e.target.value;renderList()}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)});
$('#btnAdd').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]);e.target.value='';if(!files.length)return;
  toast('Import de '+plural(files.length,'fichier')+'…');
  const r=await addFiles(files);
  if(!r.ok)toast('Aucun fichier audio reconnu');
  else if(r.volatile)toast(r.ok+' ajouté(s), mais non conservés après fermeture');
  else toast(plural(r.ok,'titre')+' ajouté'+(r.ok>1?'s':''));
  if(V.view!=='titres')go('titres');else renderList();
});
$('#mini').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b&&b.dataset.a==='mplay'){if(cur())toggle();else if(lib.length)playList(lib.map(t=>t.id),0,'Bibliothèque');else toast('Ajoute d\u2019abord de la musique');return}
  if(b&&b.dataset.a==='mmic'){voiceToggle();return}
  if(!cur())return;
  if(b&&b.dataset.a==='mlike'){toggleFav(cur().id);return}
  $('#player').classList.add('open');
});
$('#pClose').addEventListener('click',()=>$('#player').classList.remove('open'));
$('#pEq').addEventListener('click',eqSheet);
$('#btnMic').addEventListener('click',voiceToggle);
$('#pMore').addEventListener('click',()=>{const t=cur();if(t)trackMenu(t.id)});
$('#pLike').addEventListener('click',()=>{const t=cur();if(t)toggleFav(t.id)});
$('#bPlay').addEventListener('click',toggle);
$('#bNext').addEventListener('click',()=>next(false));
$('#bPrev').addEventListener('click',prev);
$('#bShuf').addEventListener('click',toggleShuffle);
$('#bRep').addEventListener('click',cycleRepeat);
$('#bSpeed').addEventListener('click',cycleSpeed);
$('#bSleep').addEventListener('click',sleepSheet);
$('#bQueue').addEventListener('click',queueSheet);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(host.innerHTML)closeSheet();else $('#player').classList.remove('open')}
  else if(e.code==='Space'&&!/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)&&cur()){e.preventDefault();toggle()}
});

/* ---------- Démarrage ---------- */
window.__nz={lib:()=>lib,P:P,playList:playList,S:S,parseCmd:parseCmd,EQ:EQ,setEQ:setEQ,G:G};
loadLib().then(()=>{renderView();updateUI();return restoreLast()}).then(()=>{if(S.mic&&SRec){Vc.on=true;Vc.quick=0;voiceBegin(true)}}).catch(()=>{renderView();updateUI()});
})();
</script>

try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
